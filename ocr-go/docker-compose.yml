services:
  ocr-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-go:latest
    container_name: ocr-go-server
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./outputs:/app/outputs
    environment:
      PORT: 8080
      TESSERACT_LANG: ${TESSERACT_LANG:-spa}
      OUTPUT_DIR: outputs
      OCR_POOL_SIZE: ${OCR_POOL_SIZE:-4}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-30}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_BATCH_SIZE_MB: ${MAX_BATCH_SIZE_MB:-50}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
